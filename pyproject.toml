[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tabextract"
version = "0.1.0"
description = "Computer-vision engine that turns tablature videos into A4 PDFs"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "GPL-3.0-or-later" }
classifiers = [
    "License :: OSI Approved :: GNU General Public License v3 or later (GPLv3+)",
    "Programming Language :: Python :: 3.11",
    "Topic :: Multimedia :: Video",
]
dependencies = [
    # <5 is load-bearing, not caution: under opencv 5.0.0.93 the stepwise-scroll
    # regression test measures 2520px of scroll for a real 990px, and scroll-mode
    # renders fail. requirements/sidecar.txt and .github/dependabot.yml follow
    # this pin; lift it only once the engine tests pass on the new major.
    "opencv-python-headless>=4.9,<5",
    "numpy>=1.26,<3",
    "Pillow>=10.2",
    "pytesseract>=0.3.10",
    "scipy>=1.11",
    "click>=8.1",
    "pydantic>=2.6",
    "pypdf>=4.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "mypy>=1.11",
]
# Local backend of the desktop app. yt-dlp belongs here on purpose and is NOT
# frozen with PyInstaller (see server/ytdlp.py): it has to be updatable without
# waiting for a release of the app.
desktop = [
    "fastapi>=0.111",
    "uvicorn>=0.30",
    "websockets>=12.0",
    "yt-dlp>=2024.8.6",
]
# Freezing the sidecar. Releases install `desktop` + `build` from the hashed
# lock in requirements/sidecar.txt, so the frozen bundle is reproducible;
# regenerate it with the command at the top of that file.
build = [
    "pyinstaller>=6",
]
# End-to-end tests against the real sidecar (tests/e2e/). They also need the
# `desktop` extra; httpx lives here and not there because requirements/sidecar.txt
# is compiled from `desktop`, and a test client has no place in the frozen bundle.
e2e = [
    "httpx>=0.27",
]

[project.scripts]
tabextract = "tabextract.cli:main"

[tool.setuptools.packages.find]
# Only the engine is published to PyPI; server/ lives in the repo, not the wheel.
include = ["tabextract*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "e2e: slow end-to-end tests that decode real video and start the sidecar; need ffmpeg, tesseract and the desktop + e2e extras",
]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = [
    "E501",   # line length is the formatter's job, not the linter's
    "B008",   # Depends()/File() in defaults is the FastAPI idiom
    "B905",   # zip() without strict: several zip(xs, xs[1:]) differ in length on purpose
    "UP042",  # str+Enum rather than StrEnum: it changes what str() returns, and
              # that value travels serialised to the frontend and saved profiles
]

[tool.mypy]
# No python_version pin on purpose: each matrix job checks against the
# interpreter it runs on. Pinning it to 3.11 broke the 3.12 runners, where pip
# installs numpy >= 2.5, whose stubs use `type X = ...` (PEP 695) - syntax mypy
# rejects when asked for 3.11 semantics.
ignore_missing_imports = true
# The engine is numeric code: demanding full annotations over cv2/numpy is more
# noise than signal. What is already annotated gets checked.
check_untyped_defs = false
