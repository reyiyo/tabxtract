name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Nothing here publishes: a read-only token keeps a compromised step from
# pushing to the repo.
permissions:
  contents: read

# Third-party actions are pinned to a commit SHA (the tag is in the comment):
# a tag can be moved to different code, a commit cannot.

jobs:
  engine:
    name: Engine (${{ matrix.os }}, py${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}
          cache: pip

      # The engine shells out to ffmpeg, so the tests need it present.
      - name: ffmpeg (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: ffmpeg (macOS)
        if: runner.os == 'macOS'
        run: brew install ffmpeg
      - name: ffmpeg (Windows)
        if: runner.os == 'Windows'
        run: choco install ffmpeg -y --no-progress

      - run: pip install -e ".[dev]"

      - name: Lint
        run: ruff check tabextract server tests scripts
      - name: Version declared consistently
        run: python scripts/check_versions.py

      - name: Type check
        run: mypy tabextract server

      # Includes the identical-pages regression test, which covers silent
      # page loss (see ARCHITECTURE.md, failure mode 1).
      - name: Tests
        run: pytest -v --cov=tabextract --cov-report=term-missing

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npx eslint .
      - run: npm test

  build-check:
    name: Tauri build (Linux)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with: { node-version: 24, cache: npm }
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with: { python-version: "3.11" }
      # Pinned to a SHA the action cannot infer the toolchain from its ref, so
      # it has to be named.
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: stable
      - uses: swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: src-tauri

      - name: System dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev \
            librsvg2-dev patchelf ffmpeg tesseract-ocr binutils

      - run: npm ci
      # Same hashed lock as the release, so this checks what actually ships.
      - run: |
          pip install --require-hashes -r requirements/sidecar.txt
          pip install --no-deps -e .

      # Freezes the backend and verifies it by starting it: PyInstaller
      # happily delivers bundles missing a dynamic import.
      - name: Sidecar
        run: python scripts/build_sidecar.py --target x86_64-unknown-linux-gnu

      - name: Native binaries
        run: python scripts/fetch_native_deps.py

      # tauri.conf.json references icon.icns/.ico, which are generated here.
      - name: Icons
        run: npx tauri icon src-tauri/icons/source.png

      - run: npx tauri build --bundles deb
