name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Nothing here publishes: a read-only token keeps a compromised step from
# pushing to the repo.
permissions:
  contents: read

# Third-party actions are pinned to a commit SHA (the tag is in the comment):
# a tag can be moved to different code, a commit cannot.

jobs:
  engine:
    name: Engine (${{ matrix.os }}, py${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.11", "3.12"]
        # The end-to-end tests run on one combination only. The matrix exists
        # to prove the engine is portable; paying six times for the same E2E
        # run proves nothing more.
        include:
          - os: ubuntu-latest
            python: "3.12"
            e2e: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}
          cache: pip

      # The engine shells out to ffmpeg and tesseract. Without tesseract the
      # bar-number OCR degrades silently (verify.py returns None), so the
      # measure-continuity check would never run here.
      - name: System dependencies (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y ffmpeg tesseract-ocr
      - name: System dependencies (macOS)
        if: runner.os == 'macOS'
        run: brew install ffmpeg tesseract
      - name: System dependencies (Windows)
        if: runner.os == 'Windows'
        run: choco install ffmpeg tesseract -y --no-progress
      # Fails loudly if tesseract is not on PATH, instead of letting the OCR
      # degrade in silence.
      - name: tesseract on PATH
        run: tesseract --version

      - run: pip install -e ".[${{ matrix.e2e && 'dev,desktop,e2e' || 'dev' }}]"

      - name: Lint
        run: ruff check tabextract server tests scripts
      - name: Version declared consistently
        run: python scripts/check_versions.py

      - name: Type check
        run: mypy tabextract server

      # Includes the identical-pages regression test, which covers silent
      # page loss (see ARCHITECTURE.md, failure mode 1). Outside the e2e
      # combination the end-to-end tests are deselected, not skipped: their
      # dependencies are not installed there.
      - name: Tests
        # Where the e2e tests are selected, a missing dependency fails them
        # instead of skipping them (tests/e2e/_deps.py).
        env:
          TABXTRACT_E2E_REQUIRED: ${{ matrix.e2e && '1' || '' }}
        run: pytest -v --cov=tabextract --cov-report=term-missing ${{ !matrix.e2e && '-m "not e2e"' || '' }}

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npx eslint .
      - run: npm test

  app-e2e:
    name: App end-to-end (browser)
    runs-on: ubuntu-latest
    # Its own job rather than a step in `frontend`: this one needs Python with
    # the desktop extras, ffmpeg and a browser, and a broken sidecar dependency
    # here must not hide the frontend's lint and unit results.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm

      # The synthetic video is encoded at test time; nothing is committed.
      # tesseract is installed for the same reason the .deb depends on it: so
      # the browser drives the app the user's machine runs, with the
      # bar-number check available rather than reported as missing.
      - name: System dependencies
        run: sudo apt-get update && sudo apt-get install -y ffmpeg tesseract-ocr

      # The sidecar the browser talks to is the real one, started by the
      # Playwright global setup.
      - run: pip install -e ".[desktop]"
      - run: npm ci

      - name: Playwright browser cache
        id: playwright-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      - name: Playwright browser
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install chromium
      # Its system libraries are apt packages, outside the cached directory, so
      # they are installed on every run.
      - name: Playwright system libraries
        run: npx playwright install-deps chromium

      # The e2e sources are outside the app's tsconfig (they are Node, not DOM
      # only), so they get their own type check.
      - name: Type check
        run: npx tsc -p e2e

      - run: npm run test:e2e

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  build-check:
    name: Tauri build (Linux)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with: { node-version: 24, cache: npm }
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with: { python-version: "3.11" }
      # Pinned to a SHA the action cannot infer the toolchain from its ref, so
      # it has to be named.
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: stable
      - uses: swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: src-tauri

      - name: System dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev \
            librsvg2-dev patchelf ffmpeg tesseract-ocr binutils

      - run: npm ci
      # Same hashed lock as the release, so this checks what actually ships.
      - run: |
          pip install --require-hashes -r requirements/sidecar.txt
          pip install --no-deps -e .

      # The lock is what reaches the user, and `--no-deps` above hides any
      # conflict with pyproject.toml. This is what a dependency bump needs to
      # pass: `pip check` sees the conflict (it would have named
      # opencv-python-headless 5.0.0.93 against the declared <5), and the
      # engine tests then run against the exact versions that get frozen,
      # instead of against whatever pip resolves for the `engine` job.
      - name: Locked dependencies agree with the engine
        run: pip check
      - name: Engine tests against the locked versions
        run: |
          pip install --no-deps pytest pluggy iniconfig
          pytest -q -m "not e2e"

      # Freezes the backend and verifies it by starting it: PyInstaller
      # happily delivers bundles missing a dynamic import.
      - name: Sidecar
        run: python scripts/build_sidecar.py --target x86_64-unknown-linux-gnu

      - name: Native binaries
        run: python scripts/fetch_native_deps.py

      # tauri.conf.json references icon.icns/.ico, which are generated here.
      - name: Icons
        run: npx tauri icon src-tauri/icons/source.png

      # The release signs the updater manifest with a secret this job cannot
      # have: it runs on pull_request, where secrets are unavailable to forks
      # and to Dependabot. The check only has to prove the app compiles and
      # bundles, so it builds without updater artifacts; release.yml does the
      # signing with the real key.
      - run: >
          npx tauri build --bundles deb
          --config '{"bundle":{"createUpdaterArtifacts":false}}'

      # What only shows up on the user's machine: the .deb installed for real
      # (its declared dependencies resolved by apt), then checked from the
      # installed tree -- declared resources present, executable bits intact,
      # native binaries starting, and the frozen sidecar answering /api/health.
      - name: Installed package smoke test
        run: |
          shopt -s nullglob
          debs=(src-tauri/target/release/bundle/deb/*.deb)
          if [ "${#debs[@]}" -ne 1 ]; then
            echo "expected exactly one .deb, found ${#debs[@]}: ${debs[*]}"
            exit 1
          fi
          sudo apt-get install -y --no-install-recommends "./${debs[0]}"
          python scripts/check_installed_bundle.py --deb "${debs[0]}"
