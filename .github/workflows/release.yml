name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: Tag to build
        required: true

permissions:
  contents: write

# This workflow holds the updater signing key and a token that can publish
# releases, so every third-party action is pinned to a commit SHA (the tag is
# in the comment): a tag can be moved to different code, a commit cannot.

jobs:
  build:
    name: ${{ matrix.label }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # macOS goes per architecture rather than universal: the sidecar is
          # a frozen Python bundle and PyInstaller does not cross-compile, so a
          # universal binary would carry a backend that runs on only one of the
          # two. Two .dmg files, each with its own engine.
          - os: macos-14
            label: macOS (Apple Silicon)
            target: aarch64-apple-darwin
            args: "--target aarch64-apple-darwin"
          # macos-13 was retired in December 2025. macos-15-intel is the only
          # x86_64 runner left and it lives until August 2027; after that
          # GitHub offers no more macOS Intel and this build has to be dropped
          # or moved to a self-hosted runner.
          - os: macos-15-intel
            label: macOS (Intel)
            target: x86_64-apple-darwin
            args: "--target x86_64-apple-darwin"
          # ubuntu-22.04 starts deprecation on 2026-09-17, with brownouts that
          # fail the job. Mind the base when changing it: the .deb and the
          # AppImage inherit the runner's glibc floor (24.04 means 2.39), which
          # leaves out Ubuntu 22.04 and Debian 12. If that floor matters, the
          # way out is building Linux in the container from
          # docker/build-linux.Dockerfile (bookworm, glibc 2.36).
          - os: ubuntu-24.04
            label: Linux x64
            target: x86_64-unknown-linux-gnu
            args: ""
          - os: windows-latest
            label: Windows x64
            target: x86_64-pc-windows-msvc
            args: ""

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with: { node-version: 24, cache: npm }

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with: { python-version: "3.11" }

      - name: Version matches the tag
        run: python scripts/check_versions.py "${{ github.ref_type == 'tag' && github.ref_name || inputs.tag }}"

      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: stable
          targets: ${{ matrix.target }}

      - uses: swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: src-tauri

      - name: System dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev \
            librsvg2-dev patchelf binutils tesseract-ocr

      - name: System dependencies (macOS)
        if: runner.os == 'macOS'
        run: brew install tesseract

      - name: System dependencies (Windows)
        if: runner.os == 'Windows'
        run: choco install tesseract -y --no-progress

      - run: npm ci

      # Freezes the FastAPI backend (onedir: it starts much faster than
      # onefile, which unpacks on every run) and verifies it by starting it.
      # Dependencies come from the hashed lock, so what a given release froze
      # is known and auditable after the fact.
      - name: Python sidecar
        run: |
          pip install --require-hashes -r requirements/sidecar.txt
          pip install --no-deps -e .
          python scripts/build_sidecar.py --target ${{ matrix.target }}

      # GPL ffmpeg (the app is GPL-3.0, no LGPL build needed), the official
      # unfrozen yt-dlp and eng.traineddata from tessdata_fast (no osd).
      - name: Native binaries
        run: python scripts/fetch_native_deps.py

      - name: Icons
        run: npx tauri icon src-tauri/icons/source.png

      - name: Build and publish
        uses: tauri-apps/tauri-action@1deb371b0cd8bd54025b384f1cd735e725c4060f # action-v1.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Updater manifest signing. This is a key pair generated locally
          # with `npm run tauri signer generate` and has nothing to do with
          # code signing, which this project does not buy.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          # There are no code-signing certificates for macOS or Windows: the
          # builds ship unsigned and both systems warn on first open. The steps
          # are in the release notes below and in the README.
        with:
          tagName: ${{ github.ref_type == 'tag' && github.ref_name || inputs.tag }}
          releaseName: "TabXtract __VERSION__"
          releaseBody: |
            See [CHANGELOG.md](https://github.com/reyiyo/tabxtract/blob/main/CHANGELOG.md).

            These builds are unsigned. Code-signing certificates cost several
            hundred dollars a year and this project does not buy them, so macOS
            and Windows both warn the first time you open the app. Every binary
            here is built by public CI from the tagged source; the build log is
            on the Actions tab.

            **macOS** — the app is not notarised and arrives quarantined.
            Move it to `/Applications`, Control-click it and choose **Open**,
            then **Open** again in the dialog. A double-click will not offer
            that option. If macOS says the app is damaged:
            `xattr -dr com.apple.quarantine /Applications/TabXtract.app`
            There is one .dmg per architecture: `aarch64` for Apple Silicon and
            `x64` for Intel.

            **Windows** — SmartScreen shows "Windows protected your PC".
            Click **More info**, then **Run anyway**.

            **Linux** — AppImages need the executable bit:
            `chmod +x TabXtract-*.AppImage`
          releaseDraft: true
          prerelease: false
          uploadUpdaterJson: true
          args: ${{ matrix.args }}

  # Two things that go wrong silently and only show up by looking at the
  # release: the landing page finds builds by file extension, and latest.json
  # is written by all four jobs onto the same asset (tauri-action downloads and
  # merges it, but running in parallel two jobs can read the same base and
  # clobber each other's entry). If a platform is missing there, that platform
  # never receives updates and the release still looks complete.
  verify-assets:
    name: Verify release assets
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Check installers and updater manifest
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_type == 'tag' && github.ref_name || inputs.tag }}
        run: |
          set -euo pipefail
          names=$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" \
                    --json assets --jq '.assets[].name')
          echo "$names"

          fail=0
          for pattern in 'aarch64.*\.dmg' 'x64.*\.dmg' '\.(msi|exe)$' '\.AppImage' '\.deb'; do
            echo "$names" | grep -qE -- "$pattern" || { echo "::error::no asset matching $pattern"; fail=1; }
          done

          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --pattern latest.json --output latest.json --clobber
          for platform in darwin-aarch64 darwin-x86_64 linux-x86_64 windows-x86_64; do
            jq -e --arg p "$platform" '.platforms[$p].url' latest.json >/dev/null \
              || { echo "::error::latest.json has no entry for $platform"; fail=1; }
          done

          # An entry that exists is not the same as an entry that works: it can
          # point at an asset that never got uploaded, or carry an empty
          # signature, and the updater only finds out on a user's machine. The
          # entries are checked rather than the file names because the updater
          # artifacts are not named like the installers.
          entries=$(jq -r '.platforms | to_entries[]
                           | "\(.key)\t\(.value.url)\t\(.value.signature // "")"' latest.json)
          while IFS=$'\t' read -r platform url sig; do
            [ -n "$platform" ] || continue
            asset=${url##*/}
            echo "$names" | grep -qxF -- "$asset" \
              || { echo "::error::$platform points at $asset, which is not in the release"; fail=1; }
            [ -n "$sig" ] \
              || { echo "::error::$platform has an empty signature in latest.json"; fail=1; }
          done <<< "$entries"

          jq '.platforms | keys' latest.json
          exit $fail
