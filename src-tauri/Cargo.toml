[package]
name = "tabxtract"
version = "0.1.0"
description = "Extracts tablature from video and rebuilds it as a printable PDF"
authors = ["TabXtract contributors"]
license = "GPL-3.0-or-later"
repository = "https://github.com/reyiyo/tabxtract"
edition = "2021"
rust-version = "1.77.2"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-shell = "2"
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
tauri-plugin-updater = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
